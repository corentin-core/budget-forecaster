{% extends "base.html" %}
{% block title %}{{ _("Operations") }} — Budget Forecaster{% endblock %}
{% block content %}
<section class="card">
  <form class="filters" id="filter-form"
        hx-get="/operations"
        hx-target="#ledger-area"
        hx-swap="innerHTML"
        hx-trigger="submit, change, keyup changed delay:300ms from:input[name=search]">
    <input type="search" name="search" placeholder="{{ _('Search...') }}"
           value="{{ filters.search }}" />
    <select name="category">
      <option value="">{{ _("All categories") }}</option>
      {% for category in categories %}
        <option value="{{ category.value }}"
                {{ 'selected' if filters.category == category.value }}>
          {{ category.value | category_name }}
        </option>
      {% endfor %}
    </select>
    <label class="date-field">
      {{ _("From") }}
      <input type="date" name="date_from" value="{{ filters.date_from }}" />
    </label>
    <label class="date-field">
      {{ _("To") }}
      <input type="date" name="date_to" value="{{ filters.date_to }}" />
    </label>
    <label class="check">
      <input type="checkbox" name="uncategorized" value="true"
             {{ 'checked' if filters.uncategorized }} />
      {{ _("Uncategorized") }}
    </label>
    <noscript><button type="submit">{{ _("Filter") }}</button></noscript>
  </form>

  <div id="ledger-area">
    {% include "fragments/ledger_area.html" %}
  </div>
</section>

<div id="bulk-bar" class="bulk-bar" hidden role="region" aria-label="{{ _('Bulk actions') }}">
  <span class="bulk-count"><span data-bulk-count>0</span> {{ _("selected") }}</span>
  <select id="bulk-category" name="bulk_category" aria-label="{{ _('Category') }}">
    {% for category in categories %}
      <option value="{{ category.value }}">{{ category.value | category_name }}</option>
    {% endfor %}
  </select>
  <button type="button" class="btn primary"
          hx-post="/operations/categorize"
          hx-include="[name='ids']:checked, #bulk-category, #filter-form"
          hx-target="#ledger-area" hx-swap="innerHTML">
    {{ _("Categorize") }}
  </button>
  <button type="button" class="btn" data-bulk-clear>{{ _("Clear") }}</button>
</div>

<script src="/static/operations.js" defer></script>
{% endblock %}
