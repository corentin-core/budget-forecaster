{% if rows %}
  {% for row in rows %}
    {% include "fragments/ledger_row.html" %}
  {% endfor %}
  {% if next_offset is not none %}
    <tr id="load-more-row">
      <td colspan="5" class="load-more-cell">
        <button class="more-btn"
                hx-get="/operations?{{ query }}&offset={{ next_offset }}"
                hx-target="#load-more-row" hx-swap="outerHTML">
          {{ _("Show more") }}
        </button>
      </td>
    </tr>
  {% endif %}
{% else %}
  <tr><td colspan="5" class="empty">{{ _("No operations") }}</td></tr>
{% endif %}
