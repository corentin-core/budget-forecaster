{# One ledger line: select checkbox, inline categorize, link action. #}
<tr id="op-row-{{ row.operation.unique_id }}" class="op-row">
  <td class="select-cell">
    <input type="checkbox" name="ids" value="{{ row.operation.unique_id }}"
           class="row-select" aria-label="{{ _('Select operation') }}" />
  </td>
  <td class="date" data-label="{{ _('Date') }}">{{ row.operation.operation_date | frdate }}</td>
  <td class="desc" data-label="{{ _('Description') }}">
    <a href="/operations/{{ row.operation.unique_id }}">{{ row.operation.description }}</a>
    {% if row.linked %}
      <span class="link-tag" title="{{ row.target_name }}">→ {{ row.target_name }}</span>
    {% endif %}
  </td>
  <td class="num {{ 'positive' if row.operation.amount > 0 else 'negative' }}"
      data-label="{{ _('Amount') }}">{{ row.operation.amount | signed_eur(currency) }}</td>
  <td class="cat" data-label="{{ _('Category') }}">
    <div class="cat-actions">
      <select class="row-category" name="category"
              hx-post="/operations/{{ row.operation.unique_id }}/categorize"
              hx-target="#op-row-{{ row.operation.unique_id }}"
              hx-swap="outerHTML"
              hx-trigger="change"
              aria-label="{{ _('Category') }}">
        {% for c in categories %}
          <option value="{{ c.value }}" {{ 'selected' if row.operation.category == c }}>{{ c.value | category_name }}</option>
        {% endfor %}
      </select>
      <a class="link-action" href="/operations/{{ row.operation.unique_id }}/link"
         aria-label="{{ _('Link') }}" title="{{ _('Link') }}">🔗</a>
    </div>
  </td>
</tr>
