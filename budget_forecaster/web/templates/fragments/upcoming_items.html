{% for item in upcoming %}
  <li{% if item.late %} class="late"{% endif %}>
    <span class="up-date">
      {%- if item.late %}<span class="late-marker" title="{{ _('Overdue: not yet posted') }}">⚠</span> {% endif -%}
      {{ item.iteration_date | frdate }}
    </span>
    <span class="up-desc">{{ item.description }}</span>
    <span class="up-amount {{ 'positive' if item.amount > 0 else 'negative' }}">
      {{ item.amount | signed_eur(item.currency) }}
    </span>
  </li>
{% endfor %}
